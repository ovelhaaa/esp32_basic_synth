name: Build ESP32 FM Synth

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v1

    - name: Install ESP32 Platform
      run: |
        arduino-cli config init
        arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

    - name: Install Dependencies
      run: |
        mkdir -p ~/Arduino/libraries
        cd ~/Arduino/libraries
        git clone https://github.com/marcel-licence/ML_SynthTools ML_SynthTools
        # Note: MoogLadders code is integrated into the project source, so no separate install needed.

    - name: Compile Sketch
      run: |
        arduino-cli compile --fqbn esp32:esp32:lolin32-lite --warnings all ./esp32_fm_synth.ino
